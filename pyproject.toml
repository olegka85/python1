[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "garment-erp"
version = "0.1.0"
description = "Transactional garment manufacturing ERP backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3", "sqlalchemy[asyncio]>=2.0,<2.1",
  "alembic>=1.14,<2", "asyncpg>=0.30,<1", "httpx[socks]>=0.28,<1",
  "pyjwt[crypto]>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1", "pytest>=8,<10", "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8", "ruff>=0.9,<1", "pyyaml>=6,<7",
]

[project.scripts]
garment-worker = "garment_erp.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/garment_erp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["postgres: requires a disposable ERP_TEST_DATABASE_URL PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
